plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.example'
version = '1.0'

dependencies {
    implementation 'org.springframework:fixture-denied:1.0'
}

publishing {
    repositories {
        maven {
            name = 'fixtureRepository'
            url = uri("$rootDir/repository")
        }
    }
    publications {
        fixture(MavenPublication) {
            from components.java
        }
    }
}
