plugins {
    id 'lamp.standalone-contract'
}

standaloneApp {
    mode = 'strict'
    allowedProjectDependencies = [':allowed-project'] as Set
    allowedRuntimeCoordinates = ['com.example:fixture-transitive-runtime:1.0'] as Set
}

dependencies {
    implementation project(':allowed-project')
    implementation 'com.example:fixture-transitive-runtime:1.0'
}
