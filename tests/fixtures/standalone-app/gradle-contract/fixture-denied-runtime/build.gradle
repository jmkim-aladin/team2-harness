plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'org.springframework'
version = '1.0'

publishing {
    repositories {
        maven {
            name = 'fixtureRepository'
            url = uri("$rootDir/repository")
        }
    }
    publications {
        fixture(MavenPublication) {
            artifactId = 'fixture-denied'
            from components.java
        }
    }
}
