# 투비컨티뉴드 (ToBe) 서비스 프로파일
# 소스: /Users/user/Documents/workspace/tobe

service_id: tobe
name: 투비컨티뉴드 (tobe)
type: legacy
description: "디지털 콘텐츠 크리에이터 플랫폼 — 노트/블로그/디지털 작품 발행, 멤버십, 정산 관리"

core_features:
  source:
    authority: "YouTrack KB"
    article_id: "REF-A-3528"
    title: "투비컨티뉴드 핵심 기능"
    url: "https://aladincommunication.youtrack.cloud/articles/REF-A-3528"
    updated_at: "2026-05-28 15:37:25 +09:00"
    synced_at: "2026-08-27"
  definition:
    target: "콘텐츠 열람, 결제, 작가 정산 등 플랫폼의 기본 루프에 반드시 필요한 기능"
    assessment_axes:
      strategic_importance: "서비스·비즈니스 관점에서 기능이 필요한 이유"
      system_risk: "기술·운영 관점에서 기능을 신중하게 다뤄야 하는 정도"
    strategic_criteria:
      - name: "가치 전달"
        description: "독자·작가(CP)·운영자의 핵심 행동을 직접 지원"
      - name: "신뢰·규제"
        description: "규제 준수나 사용자 신뢰와 직결되며, 누락 시 법적 문제나 이탈 발생"
      - name: "전략"
        description: "작가 친화적 정산 구조·특정 장르 특화 UX처럼 투비만의 포지셔닝을 형성"
    system_risk_criteria:
      - name: "흐름 차단"
        description: "장애 시 콘텐츠 접근 제어 등 다음 단계 진행 불가"
      - name: "신뢰 훼손"
        description: "잘못된 정산 금액 표시 등으로 사용자·파트너 신뢰 훼손"
      - name: "데이터 오염"
        description: "정산 수수료 자동 공제 오류처럼 파급 범위가 넓고 복구가 어려운 데이터 생성"
      - name: "가역성 없음"
        description: "정산금 지급처럼 실행 후 취소·수정이 불가능하거나 복잡"
      - name: "대상 제한"
        description: "성인 인증·탈퇴 회원 멤버십처럼 허용·차단 판단 오류 시 법적·정책적 위험 발생"
  items:
    - category: "결제/수익화"
      name: "포인트·유료 콘텐츠 결제"
      scope:
        - "포인트 충전·차감"
        - "결제 상태 처리·환불·복구"
        - "유료 콘텐츠 구매"
        - "유료 응원 결제"
      strategic_importance: "최상"
      system_importance: "최상"
      impact: "수익 흐름의 시작과 끝"
    - category: "멤버십"
      name: "멤버십 가입·결제·상태 관리"
      scope:
        - "가입·결제"
        - "구독 여부 판단"
        - "상태 관리"
      strategic_importance: "최상"
      system_importance: "최상"
      impact: "독립 결제 흐름이며 상태 불일치가 접근 권한 오류에 직결"
    - category: "성인 인증/정책"
      name: "성인 콘텐츠 접근·전시 제어"
      scope:
        - "성인 콘텐츠 접근·전시"
        - "노출 제어 설정"
      strategic_importance: "최상"
      system_importance: "최상"
      impact: "판단 오류가 법적 위험과 서비스 신뢰도에 직접 영향"
    - category: "콘텐츠 접근 권한"
      name: "콘텐츠 접근 권한 판단"
      scope:
        - "구매 여부 판단"
        - "구독 여부 판단"
        - "미리보기 범위 처리"
      strategic_importance: "상"
      system_importance: "최상"
      impact: "시스템 정합성이 콘텐츠 가치 전달 조건에 직접 영향"
    - category: "정산"
      name: "작가 정산"
      scope:
        - "수수료 자동 공제"
        - "정산 금액 확인"
        - "정산 포함·제외 처리"
        - "정산 자료 관리"
      strategic_importance: "상"
      system_importance: "최상"
      impact: "지급 후 되돌리기 어렵고 데이터 오염 위험이 집중"
    - category: "창작/발행"
      name: "콘텐츠 발행"
      scope:
        - "가격·기간 등 발행 설정 반영"
        - "성인 콘텐츠 발행"
      strategic_importance: "중"
      system_importance: "상"
      impact: "콘텐츠 공급 기반이지만 수익과의 직접 연결은 상대적으로 약함"

owners:
  primary: "jmkim@aladin.co.kr" # 김정민
  backup: "heum2@aladin.co.kr" # 조은흠
  additional: "heesoo@aladin.co.kr" # 박희수

components:
  tobe-web:
    description: "메인 웹 애플리케이션 (MVC + React SSR + API)"
    runtime:
      type: dotnet-framework
      version: "4.8"
      language: "C#"
      hosting: iis
    frontend:
      type: "ReactJS.NET (서버사이드 렌더링)"
      js_engine: "ClearScript.V8 7.1.5"
      typescript: "4.3"
      editor: "Froala Editor"
    solution: "Aladin.Tobe.sln"
    projects:
      - "Aladin.Tobe.Core — 공통 유틸, 예외, 확장"
      - "Aladin.Tobe.Models — DTO, 데이터 모델"
      - "Aladin.Tobe.Bll — 비즈니스 로직 (15개 모듈)"
      - "Aladin.Tobe.Dal — 데이터 액세스 (20+ Repository)"
      - "Aladin.Tobe.Web — ASP.NET MVC + React + API"

  tobe-batch:
    description: "배치 작업 (SQL Server Agent)"
    runtime:
      type: sql-agent
      language: "T-SQL + SSIS"
    jobs:
      - "TobeOrdersSettle_Job — 정산 처리"
      - "Note_BookingPublish_Job — 예약 발행"
      - "NoteReport_Grade_Job — 노트 등급 산정"
      - "TobeOrdersMembershipSettle_Job — 멤버십 정산"
      - "검색 인덱싱 및 실시간 업데이트 (SSIS)"
      - "포인트/리워드 처리"
      - "통계 집계"
      - "검색 키워드 인기도 계산"
    job_count: "40+"

repos:
  # 팀 관리 레포
  tobe-web: "https://github.com/AladinCommunication/Tobe"
  tobe-db-script: "https://github.com/AladinCommunication/tobe-db-script"

  # 앱 (개발 4팀 관리)
  tobe-android: "https://github.com/AladinCommunication/ToBeAndroid" # 개발 4팀
  tobe-ios: "https://github.com/AladinCommunication/ToBeIos" # 개발 4팀

youtrack:
  project_key: DEV2
  ticket_format: "DEV2-{number}"
  branch_convention: "feature/{TICKET-ID}"
  example: "feature/DEV2-4827"

architecture:
  pattern: "Layered Architecture (N-Tier)"
  layers:
    presentation: "Controllers (20+), Views (MVC), ViewsReact (React SSR)"
    business: "Aladin.Tobe.Bll (Account, Auth, Editor, Event, Ground, Intra, Library, Main, Noti, Order, ReportCenter, Search, Space, Studio, Tobelog)"
    data_access: "Aladin.Tobe.Dal (20+ Repository — AccountRepository, OrderProcessRepository, CreatorRepository 등)"
    models: "Aladin.Tobe.Models (도메인별 DTO)"
    core: "Aladin.Tobe.Core (공통 유틸)"
    database: "MSSQL Stored Procedures, Functions, Views"
  design_patterns:
    - "Repository Pattern: 도메인별 Repository"
    - "Dependency Injection: Unity Container"
    - "Configuration Transform: 환경별 Web.config 변환"

stack:
  framework: "ASP.NET MVC (.NET Framework 4.8)"
  language: "C#"
  build_tool: "MSBuild (VS 2022)"
  orm: "Dapper 2.0"
  logging: "NLog 5.4.0 (Discord webhook 연동)"
  serialization: "Newtonsoft.Json 13.0.3"
  api: "ASP.NET Web API 5.2.7"
  api_docs: "Swagger 5.6.0"
  auth: "Microsoft.IdentityModel 6.19.0, jose-jwt 4.0.0"
  security: "BouncyCastle 1.9.0, Aladdin.Encryption"
  html: "HtmlAgilityPack 1.11.40"
  excel: "EPPlus 4.5.3.3 / 6.0.0"
  http_client: "RestSharp 107.1.2"
  internal_frameworks:
    - "Aladdin.AppBlock"
    - "Aladdin.DataBlock"
    - "Aladdin.FrameWork"
    - "Aladdin.Encryption"

data:
  db_type: mssql
  db_version: "SQL Server 2016 SP1+"
  databases:
    - name: Tobe
      purpose: "메인 애플리케이션 DB"
      used_by: [tobe-web, tobe-batch]
      sp_count: "200+"
      is_primary: true
    - name: WebCatalog
      purpose: "카탈로그/상품 데이터"
      used_by: [tobe-web]
      ownership: shared # 알라딘 그룹 공유
    - name: Alibaba
      purpose: "서드파티 연동"
      used_by: [tobe-web]
      ownership: shared
    - name: WebMarket
      purpose: "마켓/커머스 데이터"
      used_by: [tobe-web]
      ownership: shared
    - name: WebLog
      purpose: "로깅"
      used_by: [tobe-web]
      ownership: shared
  shared_db: true # 4개 알라딘 공유 DB 참조
  direct_sp_write: true # SP 기반 write 집중적 사용 (200+ SP)
  db_scripts: "tobe-db-script 별도 레포로 관리"

controllers:
  main:
    - HomeController / HomeApiController
    - TobelogController (블로그)
    - SearchController
    - LibraryController
    - AuthController / LoginController / JoinController
    - OrderController
    - MypageController
    - AppController
    - NotificationController
  intra: # 내부 관리 도구
    - AuthorCertifiedController
    - DisplayBannerController
    - OrderController (Intra)
    - CurationController
    - EditorController
    - EventCommentController
    - EtcController

dependencies:
  inbound:
    - system: "사용자 (웹 브라우저)"
      method: "HTTP"
    - system: "앱 (모바일)"
      method: "REST API"
  outbound:
    - system: "AI 검색 서비스 (TobeApiSearch)"
      method: "REST"
      url: "ai.search.dev.aladin.co.kr"
    - system: "FAQ/몰 검색 (FaqApiSearch)"
      method: "REST"
      url: "ai.search.dev.aladin.co.kr"
    - system: "에디터 파일 스토리지"
      method: "UNC path (SMB)"
    - system: "WebCatalog DB"
      method: "MSSQL"
    - system: "WebMarket DB"
      method: "MSSQL"
    - system: "WebLog DB"
      method: "MSSQL"
    - system: "Alibaba DB"
      method: "MSSQL"

build:
  commands:
    restore: "NuGet restore"
    build: "MSBuild Aladin.Tobe.sln"
    config_transform: "Web.config → Web.Release.config / Web.Production.config"
  devops:
    build_script: "build.ps1"
    steps:
      - "AWS Secrets Manager에서 시크릿 조회"
      - "NuGet restore"
      - "MSBuild 컴파일"
      - "Web.config transform"
      - "출력: D:\\github\\Tobe"
  deploy:
    tool: "AWS CodeDeploy"
    config: "appspec.yml"
    hooks:
      - "BeforeInstall.ps1 — 파일 복사 (cp949 인코딩 이슈 주의)"
      - "build.ps1 — 빌드 및 시크릿 주입"
      - "ApplicationStart.ps1 — 서비스 시작"
      - "ValidateService.ps1 — 헬스 검증"
    os: "Windows Server"
  secrets: "AWS Secrets Manager (sm-tobe-web-config-dev, sm-tobe-web-config)"
  ci:
    - "GitHub Actions: .github/workflows/code-review.yml (ChatGPT 코드리뷰)"
  configurations: [Debug, Release, Production]

risk:
  change_frequency: "" # TODO: high / medium / low
  incident_impact: "" # TODO: high / medium / low
  data_coupling: high # 5개 DB (1 자체 + 4 공유), 200+ SP, 40+ 배치

modernization:
  track: "" # TODO: 분석 후 결정
  status: "not-started"
  notes: |
    - .NET Framework 4.8 + IIS + Windows Server — max(만권당)과 유사한 레거시 구조
    - SP 200+개, 배치 40+개 — 핵심 비즈니스 로직이 DB에 집중
    - 4개 알라딘 공유 DB 참조 — 데이터 결합도 높음
    - ReactJS.NET (서버사이드 렌더링) — 프론트엔드도 레거시
    - Wrap 트랙 유력: adapter로 감싸고 SP 확산 방지 우선
    - max와 WebCatalog, WebLog 등 공유 DB 겹침 — 현대화 시 함께 고려 필요

verification:
  # 에이전트가 스스로 판정할 red/green 신호. repo 파일에서 실증된 명령만 기록 (evidence 필수).
  status: partial
  loops:
    - component: tobe-web-devops # 배포 스크립트(PowerShell) 계약 검증 — 앱 코드는 커버하지 않음
      cwd: /Users/jm/Documents/workspace/tobe/Tobe
      test: "node .devops/tests/apple-signin-key-secret.test.mjs"
      evidence: "tobe/Tobe/.devops/tests/apple-signin-key-secret.test.mjs (top-level assert 스크립트, 2026-08-08 실행 확인 exit 0 'apple-signin-key-secret tests passed')"
  notes: |
    tobe-web 본체(.NET Framework 4.8 / Aladin.Tobe.sln)는 mac에서 실행 가능한 빌드·테스트 명령이 없다.
    Visual Studio 2022 + MSBuild(Windows) 전용이며 sln에 테스트 프로젝트가 없다 (Tobe/CLAUDE.md §Build L20-24,
    Tobe/Aladin.Tobe.sln, Tobe/.devops/build.ps1). tobe-batch는 SQL Server Agent + SSIS라 코드 레벨 루프가 없다.
    .devops/tests/s3-private-uif-key.test.mjs 는 csc + mono가 필요해 기본 mac 환경에서 실행 불가라 루프에 넣지 않았다.
    CI는 .github/workflows/code-review.yml (ChatGPT 리뷰)뿐이라 빌드·테스트 게이트가 아니다.

harness_status: "not-started"
