# 만권당 (Max) 서비스 프로파일
# 소스: /Users/user/Documents/workspace/max

service_id: max
name: 만권당 (max)
type: legacy
description: "알라딘 전자책 구독 서비스 — 콘텐츠 제공, 구독 관리, 검색/브라우즈"

core_features:
  source:
    authority: "YouTrack KB"
    article_id: "REF-A-4019"
    title: "만권당 핵심 기능"
    url: "https://aladincommunication.youtrack.cloud/articles/REF-A-4019"
    updated_at: "2026-08-23 13:13:24 +09:00"
    synced_at: "2026-08-27"
  definition:
    target: "콘텐츠 열람, 구독·이용권 결제, 출판사 정산 등 플랫폼의 기본 루프에 반드시 필요한 기능"
    assessment_axes:
      strategic_importance: "서비스·비즈니스 관점에서 기능이 필요한 이유"
      system_risk: "기술·운영 관점에서 기능을 신중하게 다뤄야 하는 정도"
    strategic_criteria:
      - name: "가치 전달"
        description: "구독자·출판사·운영자의 핵심 행동을 직접 지원"
      - name: "신뢰·규제"
        description: "규제 준수나 사용자 신뢰와 직결되며, 누락 시 법적 문제나 이탈 발생"
      - name: "전략"
        description: "있으면 좋은 기능이 아니라 만권당만의 포지셔닝을 형성"
    system_risk_criteria:
      - name: "흐름 차단"
        description: "장애 시 열람·결제 등 다음 단계 진행 불가"
      - name: "신뢰 훼손"
        description: "잘못된 정산 금액·열람 가능 수 표시로 구독자·출판사 신뢰 훼손"
      - name: "데이터 오염"
        description: "잘못된 열람 이력처럼 파급 범위가 넓고 복구가 어려운 데이터 생성"
      - name: "가역성 없음"
        description: "결제 완료·정산 지급처럼 실행 후 취소·수정이 불가능하거나 복잡"
      - name: "대상 제한"
        description: "성인 인증·계약 종료 콘텐츠처럼 허용·차단 판단 오류 시 법적·정책적 위험 발생"
  items:
    - category: "인증/회원"
      name: "회원 인증·관리"
      strategic_importance: "최상"
      system_importance: "최상"
      impact: "모든 이용 행동의 전제 조건"
    - category: "인증/회원"
      name: "회원 유형·이용 자격 판단"
      scope:
        - "정기결제 가능 여부 판단"
        - "이용권 구매 가능 여부 판단"
      strategic_importance: "최상"
      system_importance: "최상"
      impact: "판단 오류 시 미자격 회원의 서비스 이용을 허용해 법적·정책적 위험 발생"
    - category: "결제/수익화"
      name: "구독 결제·상태 관리"
      scope:
        - "가입·결제·해지·상태 관리"
        - "무료에서 유료 전환 시 사전 동의"
      strategic_importance: "최상"
      system_importance: "최상"
      impact: "수익 흐름의 시작이며 상태 오류가 콘텐츠 접근 권한에 직결"
    - category: "결제/수익화"
      name: "이용권 구매·등록·사용"
      scope:
        - "1·3·6·12개월 단건 구매"
        - "구독 이용 중 구매 차단"
      strategic_importance: "최상"
      system_importance: "최상"
      impact: "구독과 독립된 결제 흐름이며 상태 오류가 콘텐츠 접근 권한에 직결"
    - category: "콘텐츠 접근 권한"
      name: "콘텐츠 접근 권한 제어"
      scope:
        - "구독·이용권 상태 판단"
        - "성인 인증 판단"
        - "콘텐츠 계약 여부 판단"
      strategic_importance: "최상"
      system_importance: "최상"
      impact: "오류 시 미구독자 노출에 따른 법적 위험 또는 구독자 차단에 따른 즉시 이탈 발생"
    - category: "콘텐츠 이용"
      name: "열람 한도 관리"
      scope:
        - "구독 기간당 N권 열람 한도"
        - "갱신 시 열람 카운터 초기화"
      strategic_importance: "상"
      system_importance: "최상"
      impact: "기간당 열람 수 오산 또는 갱신 시 초기화 실패 시 계약 위반 발생"
    - category: "콘텐츠 이용"
      name: "뷰어·열람"
      scope:
        - "웹뷰어"
        - "오프라인을 지원하는 뷰어 앱"
      strategic_importance: "최상"
      system_importance: "최상"
      impact: "구독의 핵심 가치를 직접 전달하며 장애 시 서비스 이용 불가"
    - category: "콘텐츠 검색"
      name: "콘텐츠 검색"
      strategic_importance: "상"
      system_importance: "상"
      impact: "검색 장애 시 발견 경로가 차단되고 노출 제외 설정 누락 시 계약·저작권 위험 발생 가능"
      policy_note: "별도 정책 문서 없음. 운영툴 노출 제외 규칙은 콘텐츠 접근 권한 정책 §4.2에서 정의"
    - category: "데이터/집계"
      name: "열람 이력·통계 집계"
      scope:
        - "구독 기간 또는 이용권 기준 1개월 내 첫 번째 열람을 유니크 열람으로 집계"
        - "출간 후 1년 이내 15회, 1~2년 20회, 2년 초과 25회 정산 임계값 적용(2026년 8월 기준)"
        - "이용 제한 사용자의 열람 제외"
      strategic_importance: "상"
      system_importance: "최상"
      impact: "출판사 정산의 유일한 산정 근거이며 데이터 오염 시 출판사 신뢰 훼손"
    - category: "정산"
      name: "출판사 정산"
      scope:
        - "정산 금액 확인·집계·지급"
        - "정산 구간 내 임계값 충족 후 첫 열람 발생 시 선정산금 지급"
      strategic_importance: "상"
      system_importance: "최상"
      impact: "콘텐츠 공급 파트너십 유지에 직결되며 지급 후 회수가 어려움"

owners:
  primary: "jmkim@aladin.co.kr" # 김정민
  backup: "heum2@aladin.co.kr" # 조은흠
  additional: "heesoo@aladin.co.kr" # 박희수

# 멀티 런타임 서비스 (하위 프로젝트별 분리)
components:
  max-api:
    description: "소비자용 API"
    runtime:
      type: dotnet-framework
      version: "4.8"
      language: "C#"
      hosting: iis
    dependencies:
      - Dapper 2.0.90
      - Unity Container 5.11.11
      - AutoMapper 10.1.1
      - NLog 5.4.0
      - Swashbuckle 5.6.0

  maxcms-api:
    description: "CMS 관리자 API"
    runtime:
      type: dotnet
      version: "8.0"
      language: "C#"
      hosting: docker # K8s/Docker ready
    dependencies:
      - Dapper
      - Swashbuckle 7.1.0

  # 프론트엔드 스택은 2026-08-08 각 레포 package.json 실측으로 갱신
  max-front:
    description: "소비자용 프론트엔드"
    runtime:
      type: nextjs
      version: "15.5.18" # max-front/package.json dependencies.next ^15.5.18
      language: "TypeScript 5.2.2"
      hosting: docker # Node.js 20.9.0-alpine
    dependencies:
      - Jotai 2.20 (state) # Recoil 아님 — recoil 의존성 없음
      - React 19.2.6
      - styled-components 5.3
      - "@tanstack/react-query 5.100.9"
      - Swiper
      - dnd-kit

  maxcms-front:
    description: "CMS 관리자 프론트엔드"
    runtime:
      type: nextjs
      version: "15.5.18" # maxcms-front/package.json dependencies.next 15.5.18
      language: "TypeScript 5.9.3" # package-lock.json 확정 버전
      hosting: docker
    dependencies:
      - Jotai 2.11 (state)
      - React 19.2.6
      - Tailwind CSS 3.4
      - Ant Design 6.4.3
      - React Hook Form 7.54
      - Zod 3.24
      - "@tanstack/react-query 5.100.11"

  max-batch:
    description: "배치 작업 (SQL Server Agent)"
    runtime:
      type: sql-agent
      language: "T-SQL"
    schedulers:
      - name: LEGO
        jobs: "검색 업데이트, 상품 업데이트, 정산, 통계"
      - name: COOL
        jobs: "구독 관리, 다운로드/읽기 큐 처리"
    procedure_count: "18+ 스케줄 SP"

repos:
  # 팀 관리 레포 (핵심)
  max-api: "https://github.com/AladinCommunication/max-api"
  max-front: "https://github.com/AladinCommunication/max-front"
  maxcms-api: "https://github.com/AladinCommunication/maxcms-api"
  maxcms-front: "https://github.com/AladinCommunication/maxcms-front"
  max-db-script: "https://github.com/AladinCommunication/max-db-script"

  # 신규 전환용
  max-server: "https://github.com/AladinCommunication/MaxServer"

  # 관련 레포 (shopping/WebCatalog 공유)
  shopping-db-script: "shop-db-script (DBSourceTemplate fork)" # local: /Users/jm/Documents/workspace/shopping/shop-db-script
  aladin-mall-migration: "https://github.com/AladinCommunication/aladin-mall-migration" # 주문/땡큐 웹 (구 dev1-web-aladin)
  dev1-backoffice-thanks: "https://github.com/AladinCommunication/dev1-backoffice-thanks" # 땡큐 VB6 백오피스

  # 관련 레포 (타팀 관리)
  max-search: "https://github.com/AladinCommunication/max-search" # 검색 AI 팀 관리
  ebook-web-viewer: "https://github.com/AladinCommunication/Ebook_Web_Viewer" # 개발 4팀 관리 (뷰어)
  ebook-viewer-api: "https://github.com/AladinCommunication/EbookViewerAPI" # 개발 4팀 관리 (뷰어 API)
  ebook-ios: "https://github.com/AladinCommunication/EbookIos" # 개발 4팀 관리 (iOS 앱)
  shopping-android: "https://github.com/AladinCommunication/ShoppingAndroid" # 개발 4팀 관리 (Android 앱)

youtrack:
  project_key: DEV2

data:
  databases:
    - name: WebCatalog
      purpose: "메인 상품 카탈로그"
      used_by: [max-api, maxcms-api]
      sp_count: "410+"
    - name: EbookCms
      purpose: "CMS 콘텐츠 관리"
      used_by: [maxcms-api]
      sp_count: "171+"
    - name: Alibaba
      purpose: "외부/레거시 연동"
      used_by: [maxcms-api]
    - name: WebLog
      purpose: "로깅/분석"
      used_by: [max-api]
    - name: Tobe
      purpose: "레거시 연동"
      used_by: [max-api]
  db_type: mssql
  db_version: "SQL Server 2016 SP1+"
  shared_db: true # 여러 컴포넌트가 같은 DB 공유
  direct_sp_write: true # SP 기반 write 집중적 사용
  cache: redis

api_endpoints:
  max-api: # RoutePrefix: "Api/"
    - "Products/{itemId}"
    - "Series/{seriesId}"
    - "Browse/*"
    - "Search/*"
    - "User/*"
    - "Subscribe/*"
    - "Order/*"
    - "My/Library"
    - "My/Subscription"
    - "My/Playlist"
    - "Theme/*"
    - "Notice/*"
    - "Noti/*"
    - "Cache/*"
    - "Catalog/*"
    - "MaxGame/*"
  maxcms-api:
    - "Swagger UI: /swagger/ui (Development/Stage only)"

dependencies:
  inbound:
    - system: "프론트엔드 (max-front, maxcms-front)"
      method: REST
    - system: "내부 인증 시스템"
      method: custom
  outbound:
    - system: Redis
      method: cache
    - system: "이메일 서비스"
      method: notification
    - system: "결제 게이트웨이"
      method: REST

build:
  max-api:
    command: "NuGet restore → MSBuild (VS 2022)"
    publish_profiles: [Local, Stage, Release, Production]
    devops_script: ".devops/build.ps1"
  maxcms-api:
    command: "dotnet build / dotnet publish"
    config: "appsettings.{Environment}.json"
  max-front:
    command: "next build"
    start: "next start"
    local_dev: "Traefik + mkcert (domain: nextjs.aladin.co.kr)"
    makefile: "make initialize → npm run dev"
  maxcms-front:
    command: "next build"

architecture:
  pattern: "N-Tier (Controllers → Services → Repositories → Stored Procedures)"
  model_naming:
    M: Model
    QM: QueryModel
    LQM: ListQueryModel
    KM: KeyModel
    CM: ConditionModel
    VM: ViewModel
    IM: InputModel
  approach: "Database-First — 새 기능은 SP 설계부터 시작"

risk:
  change_frequency: "" # TODO: high / medium / low
  incident_impact: "" # TODO: high / medium / low
  data_coupling: high # 5개 DB 공유, 410+ SP, 여러 컴포넌트 공유

modernization:
  track: extract # 컴포넌트별로 다름 (아래 전략 참조)
  status: "not-started"
  strategy: |
    ## 전환 경로: .NET Framework 4.8 → .NET Core → Kotlin (Spring Boot)

    ### Phase 1: .NET Framework 4.8 → .NET Core
    - max-api 레포의 `origin/deploy/max-dev-core` 브랜치에서 .NET Core 전환 진행 중
    - SP 의존은 유지하되, adapter 패턴으로 감싸기

    ### Phase 2: .NET Core → Kotlin (Spring Boot)
    - MaxServer (https://github.com/AladinCommunication/MaxServer) 가 Kotlin 전환용 레포
    - .NET Core 전환 완료 후 Kotlin/Spring Boot로 최종 전환
    - naru, bazzar와 동일 아키텍처 (Hexagonal + DDD) 목표
    - SP를 서비스 코드로 점진적 이관

  components:
    max-api:
      current: ".NET Framework 4.8"
      phase1_target: ".NET Core"
      phase1_branch: "origin/deploy/max-dev-core" # max-api 레포 내 브랜치
      phase2_target: "Kotlin + Spring Boot"
      phase2_repo: "https://github.com/AladinCommunication/MaxServer" # Kotlin 전환용
      track: extract
    maxcms-api:
      current: ".NET 8.0"
      target: "Kotlin + Spring Boot (장기)"
      track: observe # 이미 modern, 급하지 않음
    max-front:
      current: "Next.js 15"
      track: observe # modern stack
    maxcms-front:
      current: "Next.js 15"
      track: observe # modern stack
    max-batch:
      current: "SQL Server Agent + T-SQL"
      target: "서비스 코드로 이관"
      track: wrap # SP 확산 방지 우선

  priorities:
    - "1. SP 확산 방지 — 신규 코드에서 SP 직접 호출 금지"
    - "2. max-api → .NET Core 전환 (MaxServer)"
    - "3. adapter 패턴으로 레거시 DB/SP 감싸기"
    - "4. .NET Core → Kotlin 전환"
    - "5. SP를 서비스 코드로 점진 이관"

verification:
  # 에이전트가 스스로 판정할 red/green 신호. repo 파일에서 실증된 명령만 기록 (evidence 필수).
  status: partial
  loops:
    - component: max-front
      cwd: /Users/jm/Documents/workspace/max/max-front
      build: "npm run build"
      test: "npm run test:e2e:smoke"
      lint: "npm run lint"
      typecheck: "npm run typecheck"
      evidence: "max/max-front/package.json scripts.build|lint|typecheck|test:e2e:smoke; max/CLAUDE.md §Common Commands L44-49; max-front/playwright.config.ts"

    - component: maxcms-front
      cwd: /Users/jm/Documents/workspace/max/maxcms-front
      build: "npm run build"
      lint: "npm run lint"
      evidence: "max/maxcms-front/package.json scripts.build|lint(eslint .); max/CLAUDE.md §Common Commands L44-45"

    - component: maxcms-api
      cwd: /Users/jm/Documents/workspace/max/maxcms-api/Aladin.MaxCms
      build: "dotnet build Aladin.MaxCms.sln"
      test: "dotnet test Aladin.MaxCms.sln"
      evidence: "maxcms-api/Aladin.MaxCms/Aladin.MaxCms.sln; 전 프로젝트 *.csproj TargetFramework=net8.0; Aladin.MaxCms.Tests/Aladin.MaxCms.Tests.csproj (xunit 2.8.1 + Microsoft.NET.Test.Sdk 17.10.0); catalog build.maxcms-api.command"

    - component: MaxServer # Kotlin 전환 레포. prod max-batch 런타임
      cwd: /Users/jm/Documents/workspace/max/MaxServer
      build: "./gradlew build architectureCheck"
      test: "./gradlew test ktlintCheck"
      lint: "./gradlew ktlintCheck"
      evidence: "max/MaxServer/CLAUDE.md L25(build architectureCheck)·L28(test ktlintCheck); MaxServer/build.gradle.kts plugins(architecture-rules, ktlint, kover); build-logic/convention/src/main/kotlin/kotlin-common.gradle.kts L3(ktlint)"

    - component: EbookApiServer # 뷰어 접근권한 API (Kotlin/Spring)
      cwd: /Users/jm/Documents/workspace/max/EbookApiServer
      build: "./gradlew build"
      test: "./gradlew test"
      evidence: "max/CLAUDE.md §EbookApiServer L62-63; EbookApiServer/gradlew; build.gradle.kts tasks.withType<Test>{useJUnitPlatform()}; 4개 모듈 전부 src/test 보유"
  notes: |
    max-api(.NET Framework 4.8)와 max-batch(SQL Server Agent)는 mac에서 실행 가능한 검증 명령이 없다.
    max-api는 Visual Studio 2022 + MSBuild(Windows) 전용이고 테스트 프로젝트가 없다 (max/CLAUDE.md §max-api/maxcms-api,
    max-api/.devops/build.ps1). max-batch는 T-SQL 스케줄 잡이라 코드 레벨 검증 루프가 없다.
    max-front E2E는 .env.test(.env.test.example 복사) + Aladin SSO 인증이 필요하다 (max/CLAUDE.md L54).
    MaxServer :adapters:maxpass-sync-mssql:integrationTest 는 MSSQL 컨테이너가 필요하다 (MaxServer/CLAUDE.md L35).

harness_status: "not-started"

infrastructure:
  # 출처: 개발3팀 양우석 (wsyang@aladin.co.kr), 2026-05-19 메일
  # 제목: [개발3팀] 만권당 API 인프라 구축 정보 공유 건 (개발계)
  # 대상: max-api 레포 deploy/max-dev-core 브랜치 (.NET Core 전환, 별도 레포 아님)

  # 도메인 규칙 — 2026-08-05 개발3팀 합의 확정.
  # 표준 SoT: policies/internal-domain-policy.md
  domain_convention:
    internal:
      pattern: "{app}.internal.max[.{env}].aladin.co.kr"
      entrypoint: "Internal ALB"
      path_strip: "해당 없음 (경로 자체가 없음)"
      apps:
        max-batch: "batch.internal.max.dev.aladin.co.kr / batch.internal.max.aladin.co.kr"
        max-admin-api: "admin-api.internal.max.dev.aladin.co.kr / admin-api.internal.max.aladin.co.kr"
    public:
      pattern: "api.max[.{env}].aladin.co.kr/{app}"
      entrypoint: "API Gateway (기존 통합 도메인 유지)"
      path_strip: "API G/W base path mapping이 strip → 앱 base-path 불필요"
      note: "앱별 외부 도메인 발급 안 함. 도메인·인증서·Route 53 레코드 증분 0"
    app_contract:
      # 상세: policies/internal-domain-policy.md §3
      - "앱 base-path 설정 금지 (spring.webflux.base-path 등)"
      - "절대 URL 반환 금지 — Location 헤더, HATEOAS, 페이지네이션 next, redirect"
      - "쿠키 기반 인증 금지 (퍼블릭 통합 도메인에서 Path=/ 쿠키는 앱 간 공유됨)"
      - "actuator 경로 고정 — /actuator/health/*, /livez, /readyz, /actuator/prometheus"
    verified_2026_08_05:
      - "MaxServer 실측: base-path·forward-headers 설정 없음, 절대 URL 생성 없음, 쿠키·세션 없음(JWT Bearer), springdoc 없음"
      - "prod 실증: api.max.aladin.co.kr/batch/actuator/health 정상 응답 (2026-07-30). 앱 base-path 없는 상태"
    migration: "신규 앱부터 적용. 기존 앱은 Internal ALB 이관 시점에 적용 (인프라팀 2026-08-03 방침)"

  dev:
    aws_account: aladin-aws-max-dev
    components:
      max-api-core:
        repo: "AladinCommunication/max-api"
        branch: "deploy/max-dev-core"
        description: "만권당 API Core (.NET Core) — max-api(.NET Framework 4.8)의 .NET Core 전환 브랜치 산출물"
        workflow: "API G/W → VPC Link V2 → ALB Internal → EKS Pod → 연계 시스템"
        api_gateway:
          domain: "api.max.dev.aladin.co.kr/max-core"
          full_domain: true
        ci_cd: "CodePipeline → CodeBuild → ECR → ArgoCD → EKS Pod"
        logs:
          cloudwatch_log_group: "/aws/containerinsights/eks-max-dev/aladin"
          purpose: "Application Logs"
        network:
          eks_subnets_cidr: "10.68.12.0/23"
    notes:
      - "개발/운영 통합 구성도 (운영은 추후 구축 예정)"
      - "서비스 간 통신이기에 방화벽 정책 사용 기간은 1년 이상으로 설정 권고"
    firewall_rules:
      # 개발계 방화벽 정책 신청 대상 (8개 룰)
      # 자세한 신청서 초안: Obsidian vault wiki/proposals/max-api-core-dev-firewall-application.md
      - id: "Rule 01"
        src: "max.dev.aladin.co.kr"
        dst: "api.max.dev.aladin.co.kr/core"
        proto_port: "TCP/443"
      - id: "Rule 02"
        src: "sync.ebook.dev.aladin.co.kr"
        dst: "api.max.dev.aladin.co.kr/core"
        proto_port: "TCP/443"
      - id: "Rule 03"
        src: "1.232.255.128/27 (고객센터)"
        dst: "api.max.dev.aladin.co.kr/core"
        proto_port: "TCP/443"
      - id: "Rule 04"
        src: "110.14.75.192/27 (물류센터)"
        dst: "api.max.dev.aladin.co.kr/core"
        proto_port: "TCP/443"
      - id: "Rule 05"
        src: "10.68.12.0/23 (eks max dev subnets)"
        dst: "CoolDev, LegoDev"
        proto_port: "TCP/1433"
      - id: "Rule 06"
        src: "api.max.dev.aladin.co.kr/core"
        dst: "ai.search.dev.aladin.co.kr/mall"
        proto_port: "TCP/443"
      - id: "Rule 07"
        src: "10.68.12.0/23 (eks max dev subnets)"
        dst: "mall.dev.aladin.co.kr"
        proto_port: "TCP/443"
      - id: "Rule 08"
        src: "10.68.12.0/23 (eks max dev subnets)"
        dst: "redis-cluster-68-max-dev (Valkey)"
        proto_port: "TCP/6379"
  prod:
    status: "built"  # 2026-07~08 max-batch 운영 배포 확인. 2026-05-19 메일 시점의 not-built는 과거 상태
    aws_account: aladin-aws-max-prod
    eks_cluster: eks-max-prod
    gitops_path: "service/aladin-aws-max-prod/eks-max-prod/helm/max-batch/"
    components:
      max-batch:
        pods: 1  # HPA max 2 (2026-07-22 인프라팀 설정)
        ingress: "AWS Load Balancer Controller Ingress → Internal ALB, target-type ip, host batch-api.internal.max.aladin.co.kr"
        service: "NodePort 80 → Pod 8080"
        api_gateway: "api.max.aladin.co.kr/batch"
        health_check: "GitOps 현재값 path /actuator/health, successCodes 200"
        probes: "GitOps 현재값 readiness/liveness tcpSocket 8080"
    note: "prod max-batch Internal ALB GitOps는 확인됨. 외부 API Gateway/VPC Link의 현재 mapping은 GitOps 밖이므로 별도 실측 필요"
    open_items:
      # 상세: policies/internal-domain-policy.md §7
      - "max-admin-api GitOps Application/Helm/Ingress/Service가 default branch에 없음 — 개발3팀 구축·경로 확인 필요"
      - "max-admin-api는 maxcms-front/maxcms-api와 분리된 Internal ALB 전용 앱 — public API Gateway mapping 생성하지 않음"
      - "max-admin front의 SSO BFF가 전달할 access token의 issuer/audience/고정 사번 claim 계약과 backend JWT 검증 설정 확인"
      - "인가 계정은 검증된 고정 claim을 사용하고 사번을 1차 후보로 검토 — issuer+subject 보조 식별, 내부 admin_id, 사번 불변성·재사용·퇴사 처리와 HMAC 필요 여부는 주니어 구현 전 선임 리뷰 TODO"
      - "max-admin-api의 기존 8081 actuator 초안은 신규 단일 8080 계약과 충돌 — 예외 공동 설계가 없으면 제거"
      - "max-admin-api business Ingress/API Gateway에서 /actuator/**, /livez, /readyz 차단 및 Pod 직접 probe/scrape 확인"
      - "max-batch의 / Prefix Ingress, /actuator/health ALB check, tcpSocket probe는 기존 앱 상태 — 신규 admin 표준으로 복사하지 않음"
      - "max-batch host batch-api.internal.max.aladin.co.kr와 확정 문법 batch.internal.max.aladin.co.kr 차이의 이관 시점 확인"
      - "firewall_rules dst를 internal 도메인으로 갱신 (전환 시)"
